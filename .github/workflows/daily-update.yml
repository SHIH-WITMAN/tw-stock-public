name: Daily Derived-Index Update (Phase 1)

on:
  schedule:
    # 週一～週五 18:30 台北時間 (UTC+8) = 10:30 UTC
    - cron: '30 10 * * 1-5'
  workflow_dispatch:
    inputs:
      years:
        description: '歷史抓取年數（首次測試可先選 3，之後改 5）'
        required: true
        default: '5'
        type: choice
        options:
          - '5'
          - '3'
      mode:
        description: '建置模式（live 抓官方盤後 / synthetic 合成測試）'
        required: true
        default: 'live'
        type: choice
        options:
          - live
          - synthetic

# 僅開啟此單一倉庫之臨時寫入權限（GITHUB_TOKEN 任務結束即自動失效，無需設定任何外部 Cloudflare 金鑰）
permissions:
  contents: write

concurrency:
  group: daily-derived-index-update
  cancel-in-progress: false

jobs:
  verify-and-update:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Restore official raw cache (data_raw)
        uses: actions/cache/restore@v4
        with:
          path: data_raw
          key: tw-stock-raw-v1-${{ github.run_id }}
          restore-keys: |
            tw-stock-raw-v1-

      - name: Install Python dependency
        run: python -m pip install --no-cache-dir -r requirements.txt

      - name: Run Python & JS unit tests
        run: |
          python -B -m unittest discover -s tests -v
          node --test tests/model.test.mjs

      - name: Record previous data_date
        id: prev
        run: |
          OLD_DATE=$(python -c "import json; print(json.load(open('web/data/latest.json'))['data_date'])" 2>/dev/null || echo "")
          echo "data_date=${OLD_DATE}" >> "$GITHUB_OUTPUT"

      - name: Build derived indices with official reference-price gate
        run: |
          if [ "${{ github.event.inputs.mode }}" = "synthetic" ]; then
            python -B -m pipeline.build_public --synthetic
          else
            YEARS="${{ github.event.inputs.years || '5' }}"
            python -B -m pipeline.build_public --years "$YEARS"
          fi

      - name: Save official raw cache (even if partial backfill)
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data_raw
          key: tw-stock-raw-v1-${{ github.run_id }}

      - name: Commit and push updated web/data to main (triggers Cloudflare Pages)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ -z "$(git status --porcelain web/data)" ]; then
            echo "ℹ️ web/data 無異動，略過推送。"
            exit 0
          fi

          NEW_DATE=$(python -c "import json; print(json.load(open('web/data/latest.json'))['data_date'])")
          OLD_DATE="${{ steps.prev.outputs.data_date }}"
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$NEW_DATE" = "$OLD_DATE" ]; then
            echo "ℹ️ 今日收盤基準日仍為 ${NEW_DATE}（可能逢國定假日休市或尚未公告），排程略過重複推送。"
            exit 0
          fi

          git add web/data
          git commit -m "data: auto update derived indices (${NEW_DATE})"
          git pull --rebase --autostash -X theirs origin main
          git push origin main
          echo "✅ 已自動更新至 ${NEW_DATE} 並推送至 main（將觸發 Cloudflare Pages 部署）"
