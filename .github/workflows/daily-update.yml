name: Daily Derived-Index Update (Phase 1)

on:
  schedule:
    # Mon-Fri 18:30 Asia/Taipei (UTC+8) = 10:30 UTC
    - cron: '30 10 * * 1-5'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Build mode (live or synthetic)'
        required: true
        default: 'live'
        type: choice
        options:
          - live
          - synthetic

permissions:
  contents: read

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4 # Production hardening: pin to full 40-char commit SHA before going public

      - name: Setup Python
        uses: actions/setup-python@v5 # Production hardening: pin to full 40-char commit SHA
        with:
          python-version: '3.11'

      - name: Setup Node
        uses: actions/setup-node@v4 # Production hardening: pin to full 40-char commit SHA
        with:
          node-version: '22'

      - name: Install Python dependency
        run: python -m pip install --no-cache-dir -r requirements.txt

      - name: Run Python & JS unit tests
        run: |
          python -B -m unittest discover -s tests -v
          node --test tests/model.test.mjs

      - name: Build derived indices with official reference-price gate
        run: |
          if [ "${{ github.event.inputs.mode }}" = "synthetic" ]; then
            python -B -m pipeline.build_public --synthetic
          else
            python -B -m pipeline.build_public --years 5
          fi

      # Uncomment when Cloudflare Pages project & least-privilege API token are configured:
